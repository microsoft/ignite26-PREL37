{{- $root := . -}}
{{- $image := printf "%s/%s@%s" .Values.image.registry .Values.image.repository .Values.image.digest -}}
{{- if eq .Values.image.tag "latest" -}}
{{- $image = printf "%s/%s:latest" .Values.image.registry .Values.image.repository -}}
{{- end -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: {{ .Release.Namespace }}
data:
  APP_VERSION: {{ .Values.image.tag | quote }}
  {{- range $key, $value := .Values.config }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- range $component := .Values.components }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $component.name }}
  namespace: {{ $root.Release.Namespace }}
  labels:
    app.kubernetes.io/part-of: {{ $root.Release.Name }}
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $component.name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $component.name }}
        app.kubernetes.io/part-of: {{ $root.Release.Name }}
        {{- if $component.workloadIdentity }}
        azure.workload.identity/use: "true"
        {{- end }}
    spec:
      hostNetwork: false
      terminationGracePeriodSeconds: 20
      {{- if $component.workloadIdentity }}
      serviceAccountName: {{ required (printf "workloadIdentity.serviceAccounts.%s must be set by the platform" $component.name) (get (default dict $root.Values.workloadIdentity.serviceAccounts) $component.name) }}
      {{- else }}
      automountServiceAccountToken: false
      {{- end }}
      nodeSelector:
        kubernetes.io/os: linux
        kubernetes.io/arch: amd64
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: {{ $component.name }}
          image: {{ $image | quote }}
          imagePullPolicy: {{ $root.Values.image.pullPolicy }}
          envFrom:
            - configMapRef:
                name: app-config
            {{- toYaml $root.Values.extraEnvFrom | nindent 12 }}
          env:
            - name: SERVICE
              value: {{ $component.name }}
            - name: PORT
              value: {{ $component.port | quote }}
            {{- if not $component.workloadIdentity }}
            - name: ENABLE_INSTRUMENTATION
              value: "false"
            {{- end }}
          ports:
            - name: http
              containerPort: {{ $component.port }}
          startupProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
            failureThreshold: {{ $component.startupFailureThreshold }}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 20
          resources:
            {{- toYaml $component.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $component.name }}
  namespace: {{ $root.Release.Namespace }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ $component.name }}
  ports:
    - name: http
      port: {{ $component.servicePort }}
      targetPort: http
{{- end }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: concierge
  namespace: {{ .Release.Namespace }}
spec:
  parentRefs:
    - name: tenants
      namespace: platform-gateway
      sectionName: http
  {{- with .Values.route.hostname }}
  hostnames:
    - {{ . | quote }}
  {{- end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: concierge
          port: 80

apiVersion: v1
kind: Namespace
metadata:
  name: platform-gateway
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-options
  namespace: platform-gateway
data:
  service: |
    spec:
      type: ClusterIP
  horizontalPodAutoscaler: |
    spec:
      minReplicas: 2
      maxReplicas: 2
  podDisruptionBudget: |
    spec:
      minAvailable: 0
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: tenants
  namespace: platform-gateway
spec:
  gatewayClassName: approuting-istio
  infrastructure:
    parametersRef:
      group: ""
      kind: ConfigMap
      name: gateway-options
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              platform.prel37.example/gateway-access: enabled

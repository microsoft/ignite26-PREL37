apiVersion: platform.prel37.example/v1alpha1
kind: AppEnvironment
metadata:
  name: ${{ values.team }}
spec:
  # Generated by the "AI application environment" Backstage template.
  team: ${{ values.team }}
  application: ${{ values.application }}
  owner: ${{ values.owner }}
  costCenter: ${{ values.costCenter }}
{%- if values.requesterObjectId %}
  requesterObjectId: "${{ values.requesterObjectId }}"
{%- endif %}
  namespaceClass: ai-dev
